[advisories]
version = 2
git-fetch-with-cli = true
# proc-macro-error is only pulled by GTK build macros in the optional Linux
# native validation target. No maintained upstream replacement is available.
# Runtime vulnerability and other maintenance advisories remain failures.
ignore = [{ id = "RUSTSEC-2024-0370", reason = "GTK build macros in the optional Linux native checker; shipped Windows/macOS/iOS targets do not compile GTK. No maintained replacement is available in upstream glib 0.18." }]

[licenses]
version = 2
confidence-threshold = 0.8
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "BSL-1.0", "OpenSSL", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
