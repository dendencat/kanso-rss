name: Signed Apple release
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Apple platform
        type: choice
        options: [macos, ios]
        required: true
permissions: { contents: read }
jobs:
  gate:
    uses: ./.github/workflows/ci.yml
  apple:
    needs: gate
    runs-on: macos-14
    environment: ${{ inputs.platform == 'ios' && 'ios-release' || 'macos-release' }}
    timeout-minutes: 60
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
      RELEASE_PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24', cache: npm }
      - run: python3 scripts/check-apple-secrets.py
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim
      - run: npm ci --ignore-scripts
      - run: cargo fetch --locked
      - run: python3 scripts/licenses.py
      - name: Sign and notarize macOS
        if: inputs.platform == 'macos'
        run: npx tauri build --ci --target universal-apple-darwin -- --locked
        working-directory: apps/native
      - name: Initialize iOS
        if: inputs.platform == 'ios'
        run: npx tauri ios init --ci
        working-directory: apps/native
      - name: Configure Apple team
        if: inputs.platform == 'ios'
        run: python3 scripts/configure-ios.py
      - name: Archive signed iOS application
        if: inputs.platform == 'ios'
        env:
          IOS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: npx tauri ios build --ci --target aarch64 --export-method app-store-connect -- --locked
        working-directory: apps/native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-apple-${{ inputs.platform }}
          path: |
            target/universal-apple-darwin/release/bundle/
            apps/native/gen/apple/build/**/*.ipa
            apps/native/gen/apple/build/**/*.xcarchive
          if-no-files-found: error
